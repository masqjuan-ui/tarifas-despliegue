name: Revisión de PR
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: read
  id-token: write
concurrency:
  group: revision-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 15
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            Revisa esta PR con `gh pr diff` y lee los archivos completos si
            hace falta contexto. Céntrate solo en estos riesgos:

            config/tarifas.json
            - Precios que no sean números positivos (0, negativos, null,
              cadenas como "12,5" o "12€") o JSON mal formado.
            - Tarifas que desaparecen o cambian de nombre respecto a la base
              (una clave eliminada y otra nueva con el mismo valor es un
              renombrado probable): rompe a quien consuma esa clave.

            .github/workflows/deploy.yml
            - Disparadores: que deje de limitarse a push a main o que se
              ejecute desde PR, forks u otras ramas.
            - Permisos: cualquier ampliación sobre contents: read.
            - Cadena test → staging → production: que production pueda
              ejecutarse sin staging, que se quite o se salte (if,
              continue-on-error, `|| true`) el smoke test o el rollback,
              o que la imagen deje de etiquetarse con el SHA.
            - Que production pierda `environment: production` y con ello
              la aprobación obligatoria.

            Publica UN solo comentario con `gh pr comment` que empiece por
            un veredicto (✅ sin riesgos / ⚠️ revisar / ❌ bloquear), y
            liste cada hallazgo con archivo, línea, riesgo y corrección
            propuesta. Si la PR no toca esos archivos, dilo en una línea.
            No comentes estilo ni nada fuera de este alcance.
